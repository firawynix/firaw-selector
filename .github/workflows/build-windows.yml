name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test extension routing and diagnostics
        shell: pwsh
        run: |
          node tests/extension-fallback.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/background-routing.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/options-diagnostic.test.js
          exit $LASTEXITCODE
      - name: Build application, host, studio, and installer
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: firaw-selector-${{ github.ref_name }}
          path: |
            dist/FirawSelector.exe
            dist/FirawSelector Host.exe
            dist/FirawSelector Studio.exe
            dist/FirawSelector Setup.exe
          if-no-files-found: error

