<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FirawSelector</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="mark">FS</div><div><strong>FirawSelector</strong><small>LINUX · 1.2.0</small></div><button id="register">Definir como seletor padrão</button></header>
<main><section id="chooser" hidden><p class="eyebrow">ABRIR LINK</p><h1>Em qual navegador?</h1><code id="url"></code><div id="browserChoices" class="browser-grid"></div><label><input id="private" type="checkbox"> Abrir em janela privativa</label></section>
<section><div class="heading"><div><p class="eyebrow">REGRAS</p><h2>Cada site no navegador certo.</h2></div><button id="add">＋ Nova regra</button></div><div id="rules"></div></section>
<section><p class="eyebrow">NAVEGADORES DETECTADOS</p><div id="detected" class="browser-grid"></div></section></main>
<dialog id="ruleDialog"><form method="dialog"><h3>Nova regra</h3><label>Tipo<select id="ruleType"><option value="contains">Contém</option><option value="domain">Domínio</option><option value="exact">Endereço com *</option><option value="regex">Expressão regular</option></select></label><label>Padrão<input id="pattern" required placeholder="exemplo.com"></label><label>Navegador<select id="ruleBrowser"></select></label><menu><button value="cancel">Cancelar</button><button id="saveRule" value="default">Salvar</button></menu></form></dialog>
<footer id="status">Configuração local · nenhuma URL é enviada pela internet</footer><script src="renderer.js"></script></body></html>
